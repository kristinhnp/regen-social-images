# Publishes any post whose time has arrived, to Facebook AND Instagram.
#
# Both platforms are handled here now. Facebook used to be left out on the
# grounds that Meta will hold a scheduled post for you - which is true, but
# it only accepts posts up to 30 days ahead, so it needed a command run by
# hand every month. That command never got run, which is why Facebook sat
# silent while Instagram posted daily. Doing both here needs no command at
# all, and the two feeds stay in step to the minute.
#
# Times below are UTC, because GitHub cron is always UTC and does not
# follow daylight saving. The window is deliberately wide enough to cover
# 08:00 New York in both summer and winter, and to absorb the delay
# GitHub sometimes adds to scheduled runs.

name: Publish due posts (Facebook + Instagram)

on:
  schedule:
    # Every 15 minutes, offset off the hour: GitHub documents the top
    # of each hour as its heaviest load window, when scheduled runs are
    # most likely to be delayed or dropped altogether.
    # That is 07:00-10:45 New York in summer, 06:00-09:45 in winter.
    - cron: "7,22,37,52 11-15 * * *"
    # One catch-up in the evening, in case the morning runs were skipped.
    - cron: "37 22 * * *"
  workflow_dispatch:        # the "Run workflow" button, for testing

# Only one run at a time, ever. Two overlapping runs could both decide the
# same post is due and publish it twice. This is the main guard against
# that; see the README for the others.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to save published.json back

    steps:
      - name: Get the code and the current record
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish anything due
        env:
          # The Page token is what actually publishes - for Instagram too,
          # because the Instagram account hangs off the Page. The User
          # token only exists to derive it, so it is not needed here.
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          # Instagram first: it is the fussier of the two, because it hands
          # Meta a URL and waits for Meta to fetch and prepare the image.
          #
          # The two are deliberately kept independent. A failure on one must
          # not stop the other, or a bad day on Instagram would silently
          # take Facebook down with it - which is the shape of the bug this
          # whole change is fixing. So each records its own exit code and
          # the step fails at the end if either did.
          set +e
          python publish.py --instagram-due --live ; ig=$?
          echo ""
          python publish_facebook.py --live       ; fb=$?
          echo ""
          echo "Instagram exit $ig, Facebook exit $fb"
          [ "$ig" -eq 0 ] && [ "$fb" -eq 0 ]

      - name: Save the record back
        # Runs even if a post failed, so a partial success is never lost.
        # Losing this file is what would allow a double post next time.
        if: always()
        run: |
          if [ -z "$(git status --porcelain published.json)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "Regen Holistics Publisher"
          git config user.email "publisher@regenholistics.local"
          git add published.json
          git commit -m "Record published posts [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "Saved."
              exit 0
            fi
            echo "Push failed, retrying ($attempt of 3)."
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "::error::Could not save published.json. Fix this before the"
          echo "::error::next run, or a post could go out twice."
          exit 1
